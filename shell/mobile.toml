# Vesly Cloud Labs | Compact Wholespace for Termius & narrow terminals.
# Plain Unicode wedges (not Powerline Private Use glyphs): works without patched fonts.
add_newline = false
palette = "vesly"
format = "$hostname$directory$git_branch$character"

[palettes.vesly]
ink = "#211330"
soft = "#D19CFF"
dark = "#7D42F6"
error = "#FF749E"

[hostname]
ssh_only = false
format = "[◀](fg:soft)[ $hostname ](fg:ink bg:soft)[▶](fg:soft)"

[directory]
truncation_length = 1
truncate_to_repo = true
format = "[ ⌁ $path](bold soft)"

[git_branch]
format = "[ · $branch](fg:dark)"

[character]
success_symbol = "[ ❯](bold dark) "
error_symbol = "[ ❯](bold error) "
