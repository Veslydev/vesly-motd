# Vesly Cloud Labs | Wholespace / Powerline-inspired
# Standard Powerline glyphs U+E0B0/U+E0B2 require a Powerline-capable terminal font.
# Left: system + metrics + duration. Right: toolchain + git + clock.
# Below: a clean directory & input line, just like Wholespace.
add_newline = false
palette = "vesly"
scan_timeout = 30
command_timeout = 600
format = """
[](fg:cream)\
[ ◈ ](fg:ink bg:cream)\
[](fg:soft bg:cream)\
[ ♡ ](fg:ink bg:soft)\
[](fg:dark bg:soft)\
${custom.metrics}\
[](fg:dark)\
$cmd_duration\
$fill\
$nodejs\
$git_branch\
$git_status\
$time\
$line_break\
$directory\
$character"""

[palettes.vesly]
ink = "#211330"
cream = "#F5E9FF"
soft = "#D19CFF"
dark = "#7D42F6"
mid = "#9867EB"
dim = "#52505C"
silver = "#E7D9F8"
error = "#FF749E"

[custom.metrics]
when = "test -r /proc/stat && command -v python3 >/dev/null"
command = "python3 /etc/vesly-shell/stats.py"
format = "[ $output ](fg:cream bg:dark)"
shell = ["sh"]

[cmd_duration]
min_time = 100
format = "[](fg:dim)[ $duration ](fg:silver bg:dim)[](fg:dim)"

[fill]
symbol = " "

[nodejs]
format = "[](fg:cream)[ node $version ](fg:ink bg:cream)"
detect_extensions = ["js","mjs","cjs","ts","mts","cts"]
detect_files = ["package.json",".node-version"]

[git_branch]
symbol = ""
format = "[](fg:soft)[ $branch ](fg:ink bg:soft)"

[git_status]
format = "[ $all_status$ahead_behind ](fg:ink bg:soft)"
disabled = false

[time]
disabled = false
time_format = "%H:%M"
format = "[](fg:cream)[ $time ](fg:ink bg:cream)[](fg:cream)"

[directory]
style = "bold soft"
truncation_length = 4
truncate_to_repo = true
format = "[⌁ $path]($style)"

[character]
success_symbol = "[ ♡](bold dark)[ ❯](bold soft) "
error_symbol = "[ ✗](bold error)[ ❯](bold error) "
